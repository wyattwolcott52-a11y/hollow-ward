name: Build apps
on:
  push: { branches: [main, master] }
  workflow_dispatch: {}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: HollowWard-Windows, path: "dist/*.exe" }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: python3 scripts/patch-android.py
      - run: npx @capacitor/assets generate --android --iconBackgroundColor "#060605" --iconBackgroundColorDark "#060605" || echo "icon step skipped"
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: HollowWard-Android, path: "android/app/build/outputs/apk/debug/*.apk" }
